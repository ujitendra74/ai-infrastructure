{% extends "frontend/base.html" %}
{% block title %}Map — Geo API{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div>
      <h5 class="mb-0">Feature map</h5>
      <small class="text-muted" id="status">Loading…</small>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="bbox-toggle" checked>
      <label class="form-check-label" for="bbox-toggle">Only load features in current view (bbox)</label>
    </div>
  </div>
  <div id="map"></div>
{% endblock %}

{% block scripts %}
<script>
  const status = document.getElementById("status");

  const vectorSource = new ol.source.Vector();
  const vectorLayer = new ol.layer.Vector({
    source: vectorSource,
    style: (feature) => new ol.style.Style({
      image: new ol.style.Circle({
        radius: 7,
        fill: new ol.style.Fill({color: feature.get("color") || "#3388ff"}),
        stroke: new ol.style.Stroke({color: "#222", width: 1}),
      }),
      stroke: new ol.style.Stroke({color: feature.get("color") || "#3388ff", width: 2}),
      fill: new ol.style.Fill({color: (feature.get("color") || "#3388ff") + "55"}),
    }),
  });

  const map = new ol.Map({
    target: "map",
    layers: [
      new ol.layer.Tile({source: new ol.source.OSM()}),
      vectorLayer,
    ],
    view: new ol.View({
      center: ol.proj.fromLonLat([5.29, 52.13]),   // NL
      zoom: 7,
    }),
  });

  // Show a popup on click
  const overlay = new ol.Overlay({
    element: Object.assign(document.createElement("div"), {className: "bg-white border rounded shadow-sm px-2 py-1 small"}),
    autoPan: {animation: {duration: 150}},
    offset: [0, -12],
    positioning: "bottom-center",
  });
  map.addOverlay(overlay);
  map.on("singleclick", (evt) => {
    const feat = map.forEachFeatureAtPixel(evt.pixel, f => f);
    if (!feat) { overlay.setPosition(undefined); return; }
    overlay.getElement().innerHTML =
      `<div><span class="swatch" style="background:${feat.get("color")||"#3388ff"}"></span>`
      + `<strong>${feat.get("name") || "(unnamed)"}</strong></div>`
      + `<div class="text-muted">id: ${feat.getId()}</div>`;
    overlay.setPosition(evt.coordinate);
  });

  async function loadFeatures() {
    if (!Auth.get()) { status.textContent = "Sign in to load features."; return; }

    const params = new URLSearchParams({page_size: "100"});
    if (document.getElementById("bbox-toggle").checked) {
      const [minX, minY, maxX, maxY] = ol.proj.transformExtent(
        map.getView().calculateExtent(map.getSize()), "EPSG:3857", "EPSG:4326");
      params.set("bbox", `${minX.toFixed(6)},${minY.toFixed(6)},${maxX.toFixed(6)},${maxY.toFixed(6)}`);
    }

    vectorSource.clear();
    let url = `/api/features/?${params.toString()}`;
    let total = 0;
    while (url) {
      const r = await Auth.fetch(url);
      if (!r.ok) { status.textContent = `Error ${r.status}`; return; }
      const data = await r.json();
      const format = new ol.format.GeoJSON();
      const feats = format.readFeatures(
        {type: "FeatureCollection", features: data.results},
        {featureProjection: "EPSG:3857", dataProjection: "EPSG:4326"},
      );
      feats.forEach((f, i) => f.setId(data.results[i].id));
      vectorSource.addFeatures(feats);
      total += feats.length;
      url = data.next;
    }
    status.textContent = `Loaded ${total} features`;
  }

  document.getElementById("bbox-toggle").addEventListener("change", loadFeatures);
  map.on("moveend", () => {
    if (document.getElementById("bbox-toggle").checked) loadFeatures();
  });
  window.addEventListener("load", loadFeatures);
</script>
{% endblock %}
