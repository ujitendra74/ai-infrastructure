<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Geo API{% endblock %}</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">

  <style>
    body { padding-top: 56px; }
    #map { width: 100%; height: calc(100vh - 96px); border: 1px solid #dee2e6; }
    .swatch { display:inline-block; width:14px; height:14px; border:1px solid #999; vertical-align:middle; margin-right:6px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'map' %}">Geo API</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'map' %}">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'features' %}">Features</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="auth-user" class="navbar-text text-white-50 small"></span>
          <button id="btn-login"  class="btn btn-outline-light btn-sm">Login</button>
          <button id="btn-logout" class="btn btn-outline-light btn-sm d-none">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login modal -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="login-form">
          <div class="modal-header"><h5 class="modal-title">Sign in</h5></div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Username</label>
              <input class="form-control" name="username" required></div>
            <div class="mb-3"><label class="form-label">Password</label>
              <input class="form-control" type="password" name="password" required></div>
            <div id="login-error" class="text-danger small d-none"></div>
            <div class="text-muted small">Default dev user: <code>admin</code> / <code>admin</code></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
  <script>
    // ---- Tiny auth client (localStorage-backed JWT) -----------------------
    const Auth = {
      key: "geo_api_jwt",
      get() { try { return JSON.parse(localStorage.getItem(this.key) || "null"); } catch(_) { return null; } },
      set(t) { localStorage.setItem(this.key, JSON.stringify(t)); this.render(); },
      clear() { localStorage.removeItem(this.key); this.render(); },
      header() { const t = this.get(); return t ? { "Authorization": "Bearer " + t.access } : {}; },
      async login(username, password) {
        const r = await fetch("/api/auth/token/", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({username, password}),
        });
        if (!r.ok) throw new Error("Invalid credentials");
        this.set({...await r.json(), username});
      },
      async refresh() {
        const t = this.get();
        if (!t?.refresh) return false;
        const r = await fetch("/api/auth/token/refresh/", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({refresh: t.refresh}),
        });
        if (!r.ok) { this.clear(); return false; }
        const data = await r.json();
        this.set({...t, access: data.access});
        return true;
      },
      async fetch(url, opts={}) {
        opts.headers = {...(opts.headers || {}), ...this.header()};
        let r = await fetch(url, opts);
        if (r.status === 401 && await this.refresh()) {
          opts.headers = {...(opts.headers || {}), ...this.header()};
          r = await fetch(url, opts);
        }
        return r;
      },
      render() {
        const t = this.get();
        document.getElementById("auth-user").textContent = t ? "Signed in as " + (t.username || "user") : "";
        document.getElementById("btn-login").classList.toggle("d-none", !!t);
        document.getElementById("btn-logout").classList.toggle("d-none", !t);
      },
    };

    document.addEventListener("DOMContentLoaded", () => {
      Auth.render();
      const modal = new bootstrap.Modal("#loginModal");
      document.getElementById("btn-login").addEventListener("click", () => modal.show());
      document.getElementById("btn-logout").addEventListener("click", () => { Auth.clear(); location.reload(); });
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const err = document.getElementById("login-error");
        err.classList.add("d-none");
        try {
          await Auth.login(fd.get("username"), fd.get("password"));
          modal.hide();
          location.reload();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove("d-none");
        }
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
